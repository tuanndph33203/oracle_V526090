services:
  anfood-fe:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ENV: uat
    image: trananh2024/anfood-fe:1.0.0
    container_name: anfood-fe
    restart: always
    ports:
      - '8086:80'
    depends_on:
      - anfood-service
      - anpos-service
    networks:
      - api-app-net

  anfood-fe-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        BUILD_ENV: production
    image: trananh2024/anfood-fe-prod:1.0.0
    container_name: anfood-fe-prod
    restart: always
    ports:
      - '8088:80'
    depends_on:
      - anfood-service
      - anpos-service
    networks:
      - api-app-net

  anfood-qr-order:
    build:
      context: ../qr-order-client
      dockerfile: Dockerfile
    image: trananh2024/anfood-qr-order:1.0.0
    container_name: anfood-qr-order
    restart: always
    ports:
      - '8087:80'
    depends_on:
      - anfood-service
    networks:
      - api-app-net

  anfood-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: trananh2024/anfood-be:1.0.0
    container_name: anfood-service
    restart: always
    ports:
      - "2001:2001"
    environment:
      - TZ=Asia/Bangkok
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:2001
      - ConnectionString__SqlServerDatabase=Server=10.8.101.236,1433;Database=staging_anfood;User Id=srv_dev;Password=abcde12345-;Encrypt=False;TrustServerCertificate=True
      - ConnectionStringHangFire=Server=10.8.101.236,1433;Database=staging_anfood_hangfire;User Id=srv_dev;Password=abcde12345-;Encrypt=False;TrustServerCertificate=True
      - RedisConfiguration__ConnectionString=10.8.101.211
