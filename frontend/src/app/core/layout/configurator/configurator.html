<div class="flex flex-col gap-y-6">
    <div>
        <span class="text-muted-color font-semibold">Màu chủ đạo</span>
        <div class="pt-2 flex gap-2 flex-wrap justify-start">
            @for (primaryColor of primaryColors(); track primaryColor.name) {
            <button
                type="button"
                [title]="primaryColor.name"
                (click)="updateColors($event, 'primary', primaryColor)"
                [ngClass]="{
                                'outline outline-primary': primaryColor.name === selectedPrimaryColor()
                            }"
                class="cursor-pointer w-6 h-6 rounded-md flex shrink-0 items-center justify-center outline-offset-1 shadow"
                [style]="{
                                'background-color': primaryColor?.name === 'noir' ? 'var(--text-color)' : primaryColor?.palette?.['500']
                            }"
            ></button>
            }
        </div>
    </div>
    <div>
        <span class="text-muted-color font-semibold">Màu nền</span>
        <div class="pt-2 flex gap-2 flex-wrap justify-start">
            @for (surface of surfaces; track surface.name) {
            <button
                type="button"
                [title]="surface.name"
                (click)="updateColors($event, 'surface', surface)"
                class="cursor-pointer w-6 h-6 rounded-md flex shrink-0 items-center justify-center p-0 outline-offset-1"
                [ngClass]="{
                                'outline outline-primary': selectedSurfaceColor() ? selectedSurfaceColor() === surface.name : layoutService.layoutConfig().darkTheme ? surface.name === 'zinc' : surface.name === 'slate'
                            }"
                [style]="{
                                'background-color': surface?.palette?.['500']
                            }"
            ></button>
            }
        </div>
    </div>
    <div class="flex flex-col gap-2">
        <span class="text-muted-color font-semibold">Phong cách</span>
        <div class="grid grid-cols-3 gap-2">
            @for (preset of presetOptions; track preset.value) {
            <p-button
                [label]="preset.label"
                [severity]="selectedPreset() === preset.value ? 'primary' : 'secondary'"
                [outlined]="selectedPreset() !== preset.value"
                (onClick)="onPresetChange(preset.value)"
                styleClass="w-full"
            />
            }
        </div>
    </div>
    <div class="flex flex-col gap-2">
        <span class="text-muted-color font-semibold">Chế độ Menu</span>
        <div class="grid grid-cols-2 gap-2">
            <p-button label="Cố định" [severity]="selectedMenuMode() === 'static' ? 'primary' : 'secondary'" [outlined]="selectedMenuMode() !== 'static'" (onClick)="onMenuModeChange('static')" styleClass="w-full" />
            <p-button label="Trượt đè" [severity]="selectedMenuMode() === 'overlay' ? 'primary' : 'secondary'" [outlined]="selectedMenuMode() !== 'overlay'" (onClick)="onMenuModeChange('overlay')" styleClass="w-full" />
        </div>
    </div>
    <div *ngIf="showMenuModeButton()" class="flex flex-col gap-2">
        <span class="text-muted-color font-semibold">Chế độ sáng / tối</span>
        <p-button type="button" (onClick)="toggleDarkMode()" [rounded]="true" [icon]="isDarkTheme() ? 'pi pi-sun' : 'pi pi-moon'" severity="secondary" />
    </div>
</div>
