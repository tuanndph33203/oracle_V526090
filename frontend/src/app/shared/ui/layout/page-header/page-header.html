<p-toolbar styleClass="!bg-surface-0 dark:!bg-surface-800 !px-5 !py-3.5 !rounded-2xl !shadow-xs !border !border-surface-200 dark:!border-surface-700 flex flex-col xl:flex-row xl:items-center justify-between gap-4">
    <ng-template #start>
        <div class="flex items-center gap-3.5 min-w-0">
            @if (icon()) {
                <div class="w-12 h-12 rounded-xl bg-primary/10 text-primary border border-primary/20 flex items-center justify-center font-black text-2xl shrink-0 shadow-2xs">
                    <i [class]="icon()"></i>
                </div>
            }
            <div class="min-w-0">
                @if (title()) {
                    <h2 class="text-2xl !my-0 font-black text-surface-900 dark:text-surface-50 m-0 tracking-tight leading-tight flex items-center gap-2 uppercase truncate">
                        {{ title() }}
                    </h2>
                }
                @if (description()) {
                    <p class="text-sm font-semibold text-surface-500 dark:text-surface-400 mt-1 mb-0 truncate">
                        {{ description() }}
                    </p>
                }
            </div>
        </div>
    </ng-template>

    <ng-template #end>
        <div class="flex flex-wrap items-center gap-3">
            <ng-content></ng-content>
        </div>
    </ng-template>
</p-toolbar>
