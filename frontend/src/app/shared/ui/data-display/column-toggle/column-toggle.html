<p-button icon="pi pi-sliders-h" label="Cột" (click)="op.toggle($event)" />

<p-popover #op>
    <div class="flex flex-col gap-3">
        <div class="bg-surface-50 dark:bg-surface-800 px-3 py-2 flex items-center">
            <h5 class="font-semibold !m-0">Cài đặt</h5>
        </div>
        <div class="px-3">
            <div class="flex justify-between items-center">
                <span>Hiển thị</span>
                <div class="flex items-center justify-between text-sm">
                    <div class="flex items-center justify-between">
                        <p-button icon="pi pi-check" severity="primary" text size="small" pTooltip="Chọn tất cả" tooltipPosition="top" (onClick)="selectAll()" />
                        <p-button icon="pi pi-refresh" severity="secondary" text size="small" pTooltip="Mặc định" tooltipPosition="top" (onClick)="resetDefault()" />
                    </div>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-x-10 gap-y-3 py-2">
                @for (col of columns(); track col.field) {
                <div class="flex items-center gap-2">
                    <p-checkbox [binary]="true" [(ngModel)]="model[col.field]" />
                    <label class="font-medium">{{ col.label }}</label>
                </div>
                }
            </div>
        </div>
        <div class="flex justify-end gap-3 p-3">
            <p-button label="Áp dụng" (click)="apply(op)" />
            <p-button severity="contrast" label="Hủy" (click)="op.hide()" />
        </div>
    </div>
</p-popover>
