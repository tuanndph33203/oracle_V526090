<form [formGroup]="form" (ngSubmit)="submit()" class="rounded-xl bg-white p-6 shadow-sm space-y-5">
    <p-password formControlName="oldPassword" placeholder="Mật khẩu cũ" [feedback]="false" toggleMask class="w-full" />
    <p-password formControlName="newPassword" placeholder="Mật khẩu mới" toggleMask class="w-full" />
    <p-password formControlName="confirmPassword" placeholder="Nhập lại mật khẩu mới" [feedback]="false" toggleMask class="w-full" />
    @if (form.hasError('passwordMismatch') && form.touched) {
    <p class="text-sm text-red-500">Mật khẩu xác nhận không khớp</p>
    }
    <div class="flex justify-end pt-2">
        <p-button label="Lưu" type="submit" severity="primary" />
    </div>
</form>
