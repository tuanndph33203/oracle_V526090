<div class="bg-surface-0 dark:bg-surface-800 p-4 rounded-md space-y-4">
    <form [formGroup]="formSearch" class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex gap-5">
            <div class="flex flex-wrap items-center gap-3">
                <p-button *hasPermission=" 'SERVICE_VIEW'" label="Thêm" icon="pi pi-plus" severity="primary" (click)="onCreate()"></p-button>
            </div>
            <p-floatlabel variant="on">
                <p-select [options]="productTypeOptions()" dataKey="Code" optionLabel="Name" optionValue="Code" formControlName="Type" class="w-full md:w-60" (onChange)="searchSelect($event.value, serviceProductType, productTypeOptions)">
                    <ng-template #selectedItem let-selectedOption>
                        <div class="flex items-center gap-2">
                            <span class="font-medium">{{ selectedOption.Code }}</span>
                            <span>- {{ selectedOption.Name }}</span>
                        </div>
                    </ng-template>
                    <ng-template let-item pTemplate="item">
                        <div class="flex items-center gap-2">
                            <span>{{ item.Code }}</span>
                            <span>- {{ item.Name }}</span>
                        </div>
                    </ng-template>
                    <ng-template pTemplate="empty">
                        <div class="text-sm text-gray-500">Không tìm thấy kết quả phù hợp</div>
                    </ng-template>
                </p-select>
                <label>Loại</label>
            </p-floatlabel>
        </div>

        <div class="flex items-center gap-3 ml-auto">
            <p-splitbutton label="Hành động" [model]="actionOptions" [severity]="'secondary'" />
            <div class="flex">
                <p-checkbox formControlName="IsGetDeleted" [binary]="true" />
                <label for="IsGetDeleted" class="ml-2 whitespace-nowrap">Đã xóa</label>
            </div>


            <app-input-date-picker formControlName="date" class="w-[270px]" />
            <span class="relative">
                <p-iconfield>
                    <p-inputicon class="pi pi-search" />
                    <input type="text" pInputText placeholder="Tìm kiếm" formControlName="TextSearch" />
                </p-iconfield>
            </span>
        </div>
    </form>
    <div class="overflow-y-auto">
        <app-table-meta
            #table
            [dataTable]="data()"
            [columns]="colsTemp()"
            [showNodata]="true"
            [showLoading]="loading()"
            [currentPage]="searchQuery().page"
            [totalData]="total()"
            [pageSize]="searchQuery().size"
            [loading]="loading()"
            [virtualScroll]="true"
            [scrollHeight]="`${37 * itemViewport() + 48}px`"
            (actionClick)="handleAction($event)"
            (actionPageChange)="onPageChange($event)"
            [showCheckboxToggle]="true"
           (actionChangeCheckbox)="onCheckboxChange($event)"
        />
    </div>
</div>
