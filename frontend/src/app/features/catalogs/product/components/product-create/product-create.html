<app-dialog-wrap [title]="edition() ? 'Chỉnh sửa sản phẩm' : 'Thêm sản phẩm'" (close)="closeDialog()">
    <form [formGroup]="form" class="flex flex-col gap-y-2 gap-x-5 p-4" (ngSubmit)="submit()">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-y-2 gap-x-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-y-2 gap-x-5 h-fit">
                <div class="flex flex-col gap-1">
                    <label class="font-medium">Mã sản phẩm <span class="text-red-500">*</span></label>
                    <input pInputText autocomplete="off" class="min-w-[270px]" formControlName="Code" placeholder="Nhập mã sản phẩm" [readOnly]="edition()" />
                    <small *ngIf="form.get('Code')?.touched && form.get('Code')?.invalid" class="text-red-500">Mã sản phẩm là bắt buộc</small>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="font-medium">Loại sản phẩm</label>
                    <p-autocomplete
                        openOnClick
                        appendTo="body"
                        formControlName="ProductTypeCode"
                        [suggestions]="productTypeOptions()"
                        optionLabel="Name"
                        placeholder="Chọn loại sản phẩm"
                        (completeMethod)="searchAutoComplete($event, productTypeService, productTypeOptions)"
                        [dropdown]="true"
                        [forceSelection]="true"
                        dataKey="Code"
                    ></p-autocomplete>
                </div>

                <div class="flex flex-col gap-1 col-span-2">
                    <label class="font-medium">Tên sản phẩm <span class="text-red-500">*</span></label>
                    <input pInputText autocomplete="off" class="min-w-[270px]" formControlName="Name" placeholder="Nhập tên sản phẩm" />
                    <small *ngIf="form.get('Name')?.touched && form.get('Name')?.invalid" class="text-red-500">Tên sản phẩm là bắt buộc</small>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="font-medium">Mã vạch</label>
                    <input pInputText autocomplete="off" class="min-w-[270px]" formControlName="BarCode" placeholder="Nhập mã vạch" />
                </div>

                <div class="flex flex-col gap-1">
                    <label class="font-medium">Xuất xứ</label>
                    <input pInputText autocomplete="off" class="min-w-[270px]" formControlName="Origin" placeholder="Nhập xuất xứ" />
                </div>

                <div class="flex flex-col gap-1">
                    <label class="font-medium">Giá mua</label>
                    <p-inputNumber formControlName="PurchasePrice" [min]="0" class="w-full"></p-inputNumber>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="font-medium">Giá bán <span class="text-red-500">*</span></label>
                    <p-inputNumber formControlName="SellingPrice" [min]="0" class="w-full"></p-inputNumber>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="font-medium">Thuế nhập</label>
                    <p-autocomplete
                        openOnClick
                        appendTo="body"
                        formControlName="ImportTaxCode"
                        [suggestions]="vatOptions()"
                        optionLabel="Name"
                        placeholder="Chọn thuế"
                        (completeMethod)="searchAutoComplete($event, vatService, vatOptions)"
                        [dropdown]="true"
                        [forceSelection]="true"
                        dataKey="Code"
                    ></p-autocomplete>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="font-medium">Đơn vị tính <span class="text-red-500">*</span></label>
                    <p-autocomplete
                        openOnClick
                        appendTo="body"
                        formControlName="UnitCode"
                        [suggestions]="unitOptions()"
                        optionLabel="Name"
                        placeholder="Chọn đơn vị tính"
                        (completeMethod)="searchAutoComplete($event, unitService, unitOptions)"
                        [dropdown]="true"
                        [forceSelection]="true"
                        dataKey="Code"
                    ></p-autocomplete>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="font-medium">Nhóm sản phẩm</label>
                    <p-autocomplete
                        openOnClick
                        appendTo="body"
                        formControlName="ProductGroupCode"
                        [suggestions]="productGroupOptions()"
                        optionLabel="Name"
                        placeholder="Chọn nhóm sản phẩm"
                        (completeMethod)="searchAutoComplete($event, productGroupService, productGroupOptions)"
                        [dropdown]="true"
                        [forceSelection]="true"
                        dataKey="Code"
                    ></p-autocomplete>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="font-medium">Thuế xuất</label>
                    <p-autocomplete
                        openOnClick
                        appendTo="body"
                        formControlName="ExportTaxCode"
                        [suggestions]="vatOptions()"
                        optionLabel="Name"
                        placeholder="Chọn thuế"
                        (completeMethod)="searchAutoComplete($event, vatService, vatOptions)"
                        [dropdown]="true"
                        [forceSelection]="true"
                        dataKey="Code"
                    ></p-autocomplete>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="font-medium">Thuế đặc biệt</label>
                    <p-autocomplete
                        openOnClick
                        appendTo="body"
                        formControlName="SpecialTaxCode"
                        [suggestions]="vatOptions()"
                        optionLabel="Name"
                        placeholder="Chọn thuế"
                        (completeMethod)="searchAutoComplete($event, vatService, vatOptions)"
                        [dropdown]="true"
                        [forceSelection]="true"
                        dataKey="Code"
                    ></p-autocomplete>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="font-medium">Tiền thuế xuất</label>
                    <p-inputNumber formControlName="ExportTaxMoney" [min]="0" class="w-full"></p-inputNumber>
                </div>

                <div class="flex flex-col gap-1 md:col-span-2">
                    <label class="font-medium">Thành tiền dự kiến</label>
                    <button pButton type="button" class="max-w-[220px] !justify-end whitespace-nowrap !cursor-default" severity="secondary" [outlined]="true">
                        {{ getTotalPrice() | number : '' : 'vi-VN' }}
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-y-2 gap-x-5 h-fit">
                <div class="flex flex-col gap-1 md:row-span-2 min-w-[270px]">
                    <label class="font-medium">Ảnh sản phẩm</label>
                    <app-file-upload-meta (uploaded)="onImagesUploaded($event)" formControlName="AvatarUrl" />
                </div>

                <div class="flex flex-col gap-1">
                    <label class="font-medium">Chi nhánh khởi tạo <span class="text-red-500">*</span></label>
                    <p-autocomplete
                        openOnClick
                        appendTo="body"
                        formControlName="BranchCode"
                        [suggestions]="branchOptions()"
                        [optionLabel]="getAutoCompleteLabel"
                        placeholder="Chọn chi nhánh"
                        [dropdown]="true"
                        [forceSelection]="true"
                        dataKey="Code"
                        (completeMethod)="searchAutoComplete($event, branchService, branchOptions)"
                    >
                        <ng-template let-item pTemplate="item">
                            <div class="flex items-center gap-2">
                                <span>{{ item.Code }}</span>
                                <span class="text-gray-500">- {{ item.Name }}</span>
                            </div>
                        </ng-template>
                    </p-autocomplete>
                </div>

                <div class="flex flex-col gap-1 md:col-span-2">
                    <label class="font-medium">Chi nhánh áp dụng</label>
                    <p-autocomplete
                        openOnClick
                        appendTo="body"
                        class="w-full max-w-[650px]"
                        [multiple]="true"
                        formControlName="ApplyListBranchCodes"
                        [suggestions]="branchMultiOptions()"
                        optionLabel="Name"
                        placeholder="Chọn nhiều chi nhánh"
                        [dropdown]="true"
                        [forceSelection]="true"
                        dataKey="Code"
                        (completeMethod)="searchAutoComplete($event, branchService, branchMultiOptions)"
                    >
                        <ng-template pTemplate="footer">
                            <div class="flex justify-between p-2">
                                <button type="button" class="text-primary font-semibold cursor-pointer" (click)="selectAllAutocomplete('ApplyListBranchCodes', branchMultiOptions)">Chọn tất cả</button>
                                <button type="button" class="text-primary font-semibold cursor-pointer" (click)="clearAllAutocomplete('ApplyListBranchCodes')">Hủy chọn</button>
                            </div>
                        </ng-template>
                        <ng-template let-item pTemplate="item">
                            <div class="flex items-center gap-2">
                                <span>{{ item.Code }}</span>
                                <span class="text-gray-500">- {{ item.Name }}</span>
                            </div>
                        </ng-template>
                    </p-autocomplete>
                </div>

                <div class="flex flex-col gap-1 md:col-span-2 md:row-span-2">
                    <label class="font-medium">Ghi chú</label>
                    <textarea pInputTextarea formControlName="Notes" rows="3" autoResize="true" placeholder="Nhập ghi chú" class="w-full"></textarea>
                </div>

                <div class="flex flex-col gap-1 col-span-2 md:row-span-4">
                    <label class="font-medium">Mô tả</label>
                    <p-editor formControlName="Description" [style]="{ height: '200px', maxWidth: '650px' }"></p-editor>
                </div>
            </div>
        </div>

        <div class="flex justify-end pt-6 gap-6">
            <button
                pButton
                type="submit"
                icon="pi pi-save"
                [disabled]="form.invalid || !form.dirty || isSubmitting()"
                [loading]="isSubmitting()"
                size="large"
                class="whitespace-nowrap"
                [label]="edition() ? 'Cập nhật' : 'Thêm mới'"
            ></button>
        </div>
    </form>
</app-dialog-wrap>
