<app-dialog-wrap [title]="edition() ? 'Chỉnh sửa' : 'Thêm mới'" (close)="closeDialog()">
    <form [formGroup]="form" class="flex flex-col gap-y-3 gap-x-5 p-4" (ngSubmit)="submit()">
        <div class="flex flex-col gap-1">
            <label for="code" class="font-medium">Mã bàn <span class="text-red-500">*</span></label>
            <input pInputText autocomplete="off" class="min-w-[270px]" id="code" formControlName="Code" placeholder="Nhập mã bàn" />
        </div>
        <div class="flex flex-col gap-1">
            <label for="name" class="font-medium">Tên bàn <span class="text-red-500">*</span></label>
            <input pInputText autocomplete="off" class="min-w-[270px]" id="name" formControlName="Name" placeholder="Nhập tên bàn" />
        </div>
        <div class="flex flex-col gap-1">
            <label class="font-medium">Sơ đồ phòng <span class="text-red-500">*</span></label>
            <p-select [options]="FloorPlanIdOptions()" optionValue="Id" optionLabel="Name" formControlName="FloorPlanId" placeholder="Chọn sơ đồ phòng" />
        </div>
        <div class="flex flex-col gap-1">
            <label class="font-medium">Chi nhánh <span class="text-red-500">*</span></label>
            <p-select [options]="BranchIdOptions()" optionValue="Id" optionLabel="Name" formControlName="BranchId" placeholder="Chọn chi nhánh" />
        </div>
        <div class="flex flex-col gap-1" *ngIf="edition()">
            <label class="font-medium">Trạng thái <span class="text-red-500">*</span></label>
            <p-select [options]="statusOptions" optionValue="value" optionLabel="label" formControlName="Status" placeholder="Chọn trạng thái" />
        </div>

        <div class="flex justify-end pt-6 gap-6">
            <button pButton type="submit" icon="pi pi-save" [disabled]="form.invalid" size="large">{{edition() ? "Cập nhật" : "Thêm mới"}}</button>
        </div>
    </form>
</app-dialog-wrap>
