<app-dialog-wrap [title]="edition() ? 'Chỉnh sửa' : 'Thêm mới'" (close)="closeDialog()">
    <form [formGroup]="form" class="flex flex-col gap-y-3 gap-x-5 p-4" (ngSubmit)="submit()">
        <div class="flex flex-col gap-1">
            <label for="code" class="font-medium">Mã ca <span class="text-red-500">*</span></label>
            <input pInputText autocomplete="off" class="min-w-[270px]" id="code" formControlName="Code" placeholder="Nhập mã ca" />
        </div>
        <div class="flex flex-col gap-1">
            <label for="name" class="font-medium">Tên ca <span class="text-red-500">*</span></label>
            <input pInputText autocomplete="off" class="min-w-[270px]" id="name" formControlName="Name" placeholder="Nhập tên ca" />
        </div>
        <div class="flex flex-col gap-1">
            <label for="starttime" class="font-medium">Giờ bắt đầu (HH:mm) <span class="text-red-500">*</span></label>
            <input pInputText autocomplete="off" class="min-w-[270px]" id="starttime" formControlName="StartTime" placeholder="Nhập giờ bắt đầu (hh:mm)" />
        </div>
        <div class="flex flex-col gap-1">
            <label for="endtime" class="font-medium">Giờ kết thúc (HH:mm) <span class="text-red-500">*</span></label>
            <input pInputText autocomplete="off" class="min-w-[270px]" id="endtime" formControlName="EndTime" placeholder="Nhập giờ kết thúc (hh:mm)" />
        </div>
        <div class="flex flex-col gap-1">
            <label class="font-medium">Loại ca <span class="text-red-500">*</span></label>
            <p-select [options]="[
                { value: 1, label: 'Ca thẳng' }, { value: 2, label: 'Ca gãy' }
            ]" optionValue="value" optionLabel="label" formControlName="ShiftType" placeholder="Chọn loại ca" />
        </div>
        <div class="flex flex-col gap-1">
            <label class="font-medium">Chi nhánh áp dụng</label>
            <p-multiselect [options]="branches()" optionValue="Id" optionLabel="Name" formControlName="BranchIds" placeholder="Chọn chi nhánh" display="chip" styleClass="w-full min-w-[270px]" />
        </div>
        <div class="flex flex-col gap-1" *ngIf="edition()">
            <label class="font-medium">Trạng thái <span class="text-red-500">*</span></label>
            <p-select [options]="statusOptions" optionValue="value" optionLabel="label" formControlName="Status" placeholder="Chọn trạng thái" />
        </div>

        <div class="flex justify-end pt-6 gap-6">
            <button pButton type="submit" icon="pi pi-save" [disabled]="form.invalid" size="large">{{edition() ? "Cập nhật" : "Thêm mới"}}</button>
        </div>
    </form>
</app-dialog-wrap>
