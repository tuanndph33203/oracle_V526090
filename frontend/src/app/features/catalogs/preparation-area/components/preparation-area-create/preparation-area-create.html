<app-dialog-wrap [title]="edition() ? 'Chỉnh sửa' : 'Thêm mới'" (close)="closeDialog()">
    <form [formGroup]="form" class="preparation-area-form flex flex-col gap-y-3 gap-x-5 p-4" (ngSubmit)="submit()">
        <div class="flex flex-col gap-1">
            <label for="code" class="font-medium">Mã khu vực <span class="text-red-500">*</span></label>
            <input pInputText autocomplete="off" class="min-w-[270px]" id="code" formControlName="Code" placeholder="Nhập mã khu vực" />
        </div>
        <div class="flex flex-col gap-1">
            <label for="name" class="font-medium">Tên khu vực <span class="text-red-500">*</span></label>
            <input pInputText autocomplete="off" class="min-w-[270px]" id="name" formControlName="Name" placeholder="Nhập tên khu vực" />
        </div>
        <div class="flex flex-col gap-1">
            <label for="areaBranches" class="font-medium">Chi nhánh áp dụng <span class="text-red-500">*</span></label>
            <p-multiselect inputId="areaBranches" [options]="branches()" optionValue="Id" optionLabel="Name" formControlName="BranchIds" placeholder="Chọn chi nhánh" display="chip" [filter]="true" appendTo="body" styleClass="w-full min-w-[270px]" />
            <small class="text-gray-500">Khu vực chế biến chỉ hiện ở các chi nhánh được chọn.</small>
        </div>
        <div class="flex flex-col gap-1">
            <label class="font-medium">Loại khu vực <span class="text-red-500">*</span></label>
            <p-select [options]="[
                { value: 1, label: 'Bếp' }, { value: 2, label: 'Bar' }, { value: 3, label: 'Cả hai' }
            ]" optionValue="value" optionLabel="label" formControlName="Type" placeholder="Chọn loại khu vực" />
        </div>
        <div class="flex flex-col gap-1">
            <label class="font-medium">Loại thiết bị <span class="text-red-500">*</span></label>
            <p-select [options]="[
                { value: 1, label: 'Tablet (Màn hình KDS)' }, { value: 2, label: 'Printer (Máy in bill)' }, { value: 3, label: 'None (Không thiết bị)' }
            ]" optionValue="value" optionLabel="label" formControlName="DeviceType" placeholder="Chọn loại thiết bị" />
        </div>
        <div class="flex flex-col gap-1">
            <label class="font-medium">Thời điểm in nhãn</label>
            <p-select [options]="[
                { value: 1, label: 'Sau khi chế biến' }, { value: 2, label: 'Sau khi trả món' }
            ]" optionValue="value" optionLabel="label" formControlName="LabelPrintTiming" placeholder="Chọn thời điểm in nhãn" />
        </div>
        <div class="flex flex-col gap-1" *ngIf="edition()">
            <label class="font-medium">Trạng thái <span class="text-red-500">*</span></label>
            <p-select [options]="statusOptions" optionValue="value" optionLabel="label" formControlName="Status" placeholder="Chọn trạng thái" />
        </div>

        <div class="flex justify-end pt-6 gap-6">
            <button pButton type="submit" icon="pi pi-save" [disabled]="form.invalid" size="large">{{edition() ? "Cập nhật" : "Thêm mới"}}</button>
        </div>
    </form>
</app-dialog-wrap>
